<form>
    <div class="custom-form-section md:col-span-12">
        <h3>Total Asignaturas: {{selectedItems().length}}</h3>
    </div>
    <div>
        <i [class]="PrimeIcons.SEARCH" class="space-y-20" [style]="{ margin: '1rem' }"></i>
        <input #search pInputText type="text" placeholder="Buscar..."
            (input)="dt1.filterGlobal(search.value, 'contains')" />
    </div>

    <p-table #dt1 dataKey="id" [value]="subjects" [columns]="columns" [paginator]="true" paginatorPosition="both"
        [rows]="40" [globalFilterFields]="['code', 'name', 'academicPeriod.name']"
        [selection]="selectedItems()" (selectionChange)="onSelectionChange($event)">

        <ng-template pTemplate="header">
            <tr>
                <th style="width:4rem">
                    <p-tableHeaderCheckbox />
                </th>
                <th>Código</th>
                <th>Asignatura</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-subject>
            <tr>
                <td>
                    <p-tableCheckbox [value]="subject" />
                </td>
                <td>{{ subject.code }}</td>
                <td>{{ subject.name }}</td>
            </tr>
        </ng-template>
    </p-table>
</form>
