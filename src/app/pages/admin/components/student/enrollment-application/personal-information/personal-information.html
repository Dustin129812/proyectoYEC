<div>
    <p-accordion [(value)]="activePanel">

        <p-accordion-panel value="personal-data">
            <p-accordion-header>
                Datos Personales
            </p-accordion-header>
            <p-accordion-content>

                <app-personal-data-form (next)="nextPanel()" #personalDataFormComponent />

            </p-accordion-content>
        </p-accordion-panel>
        <p-accordion-panel value="origin-place">
            <p-accordion-header>
                Lugar de Procedencia
            </p-accordion-header>
            <p-accordion-content>

                <app-origin-place #originComponent />

            </p-accordion-content>
        </p-accordion-panel>
        <p-accordion-panel value="residence-place">
            <p-accordion-header>
                Lugar de residencia
            </p-accordion-header>
            <p-accordion-content>
                <app-residence-place />
            </p-accordion-content>
        </p-accordion-panel>
    </p-accordion>
    <p-button [disabled]="personalDataFormComponent.form().invalid() || originComponent.form().invalid()"
        (onClick)="onSubmit()">
        Siguiente =>
    </p-button>

</div>
